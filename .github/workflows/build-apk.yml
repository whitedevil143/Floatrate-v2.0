name: Build FloatRate APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Do not let setup-android install its obsolete default "tools" package.
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fix Kotlin source compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/floaterate/app/MainActivity.kt")
          text = p.read_text(encoding="utf-8")

          replacements = {
              "    hintTextColor = muted": "    setHintTextColor(muted)",
              "    singleLine = true": "    setSingleLine(true)",
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"Expected source line not found: {old}")

          p.write_text(text, encoding="utf-8")
          print("Kotlin compatibility fixes applied successfully.")
          PY

          echo "Checking patched lines:"
          grep -nE "hintTextColor|setHintTextColor|singleLine|setSingleLine"             app/src/main/java/com/floaterate/app/MainActivity.kt

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Verify Java, Android SDK and Gradle
        run: |
          java -version
          sdkmanager --version
          gradle --version

      - name: Build installable debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatRate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

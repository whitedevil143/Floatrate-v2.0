name: Build FloatRate APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Download the project
      - name: Check out source
        uses: actions/checkout@v5

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Android SDK
      # IMPORTANT: packages: '' prevents the obsolete "tools"
      # package from being installed automatically.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 4. Install the Android SDK packages required by the project
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 5. Install/configure Gradle 8.7
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Build the debug APK
      - name: Build installable debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      # 7. Upload the APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatRate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
